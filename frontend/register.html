<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Smart Energy Tracker</title>
    
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    
    <div class="auth-wrapper">
        
        <a href="index.html" class="back-button">← Back to Home</a>
        
        <div class="auth-container">
            
            <div class="auth-card">
                
                <div class="auth-header">
                    <div class="auth-logo">⚡</div>
                    <h1>Create Account</h1>
                    <p>Start tracking your energy consumption today</p>
                </div>

                <div id="error-message" class="error-message" style="display: none;"></div>
                
                <div id="success-message" class="success-message" style="display: none;"></div>

                <form id="register-form" class="auth-form">
                    
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            placeholder="John Doe"
                            required
                            minlength="2"
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="your.email@example.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Minimum 6 characters"
                            required
                            minlength="6"
                        >
                        <div class="password-strength">
                            <div class="strength-bar" id="strength-bar"></div>
                        </div>
                        <span class="password-hint" id="password-hint">Use at least 6 characters</span>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input 
                            type="password" 
                            id="confirm-password" 
                            name="confirm-password" 
                            placeholder="Re-enter your password"
                            required
                        >
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="agree-terms" required>
                            <span>I agree to the <a href="#">Terms & Conditions</a></span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">
                        <span class="btn-text">Create Account</span>
                        <span class="btn-loader" style="display: none;">⏳</span>
                    </button>

                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Login here</a></p>
                </div>

            </div>

            <div class="benefits-preview">
                <h3>Why join EnergyTrack?</h3>
                <ul>
                    <li>✓ Track energy in real-time</li>
                    <li>✓ Save up to 35% on bills</li>
                    <li>✓ Reduce carbon footprint</li>
                    <li>✓ Free forever</li>
                </ul>
            </div>

        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    
    <script src="js/api.js"></script>
    
    <script src="js/auth.js"></script>
    
</body>
</html>
