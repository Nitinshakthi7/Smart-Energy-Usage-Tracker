<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Energy Tracker</title>
    
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    
    <div class="auth-wrapper">
        
        <a href="index.html" class="back-button">← Back to Home</a>
        
        <div class="auth-container">
            
            <div class="auth-card">
                
                <div class="auth-header">
                    <div class="auth-logo">⚡</div>
                    <h1>Welcome Back</h1>
                    <p>Login to access your energy dashboard</p>
                </div>

                <div id="error-message" class="error-message" style="display: none;"></div>
                
                <div id="success-message" class="success-message" style="display: none;"></div>

                <form id="login-form" class="auth-form">
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="your.email@example.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember-me">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full">
                        <span class="btn-text">Login</span>
                        <span class="btn-loader" style="display: none;">⏳</span>
                    </button>

                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html">Sign up for free</a></p>
                </div>

            </div>

            <div class="demo-section">
                <p>Want to try first?</p>
                <button id="demo-login" class="btn btn-demo btn-full">Try Demo Account</button>
            </div>

        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    
    <script src="js/api.js"></script>
    
    <script src="js/auth.js"></script>
    
</body>
</html>
